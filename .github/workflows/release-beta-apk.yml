name: Release Debug APK on Beta Tag

on:
  push:
    tags:
      - 'v*-beta*'
      - '*-beta*'
      - 'v*-BETA*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version Name for the Release'
        required: true
        default: 'v0.1.0-beta'

jobs:
  build-and-release:
    name: Build Debug APK and Create Pre-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          ls -l app/build/outputs/apk/debug/
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi

      - name: Rename APK for Release
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk FlowCenter-${VERSION}-debug.apk
          ls -l FlowCenter-${VERSION}-debug.apk

      - name: Create GitHub Pre-release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: FlowCenter-*-debug.apk
          prerelease: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          body: |
            Automated Debug APK build for beta release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
